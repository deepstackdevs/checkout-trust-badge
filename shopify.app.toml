# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3d2c34d3ecd2e9dbc3c9ed157faa37a3"
name = "cheeckout-badge-app"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_files"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[shop.metafields.app.trust_badge_image]
name = "Checkout trust badge"
description = "Image shown in checkout after discounts"
type = "url"

  [shop.metafields.app.trust_badge_image.access]
  admin = "merchant_read"
  storefront = "public_read"

[sidekick]
extensions_summary = "Manage the checkout trust badge image"
